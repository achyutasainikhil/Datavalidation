  - id: sat_party_identity_rtmi__party_hk_has_parent
    type: custom
    engine: sql
    name: party_hk exists in hub_party
    description: 'Every party_hk resolves to a row in hub_party, the zero-key row included. Returns each orphaned key.'
    severity: warning
    dimension: consistency
    implementation: |
      SELECT DISTINCT t.party_hk
      FROM lh_silver.party_raw_vault.sat_party_identity_rtmi AS t
